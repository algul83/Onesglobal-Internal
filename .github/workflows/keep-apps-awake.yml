# 주의: 이 파일명(=워크플로 경로)을 바꾸면 GitHub 상에서는 "새 워크플로"가 된다.
# keepalive.yml 이 60일 무활동으로 disabled_inactivity 처리되어 멈췄기 때문에
# 새 경로로 옮겨 자동으로 다시 활성화되도록 했다. 재발 방지는 repo-heartbeat.yml 담당.
name: Keep Streamlit Apps Awake (Playwright)

on:
  schedule:
    # 4시간마다 (KST 01:00, 05:00, 09:00, 13:00, 17:00, 21:00)
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Ping all apps (real WebSocket activity)
        run: node .github/scripts/keepalive.js
